[project]
name = "ollama-rag-dog-breeds"
version = "0.1.0"
description = "RAG service for dog breeds using Ollama and pgvector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pypdf>=3.17.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "livekit>=0.11.0",
    "livekit-agents>=1.2.0",
    "livekit-plugins-silero>=0.3.0",
    "livekit-plugins-openai>=0.5.0",
    "aiohttp>=3.9.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "langchain<1.0",
    "langchain-community<0.4",
    "langchain-core<1.0",
    "langchain-ollama<1.0",
    "langchain-openai<1.0",
    "ragas>=0.4.3",
    "mlflow>=2.14",
    "sentence-transformers>=3.0",
    "accelerate>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# Optional PII backend for guardrails (GUARDRAILS_PII_BACKEND=presidio). Heavy
# (spaCy ~500MB+) and NOT baked into the prod image — install explicitly only
# where the memory budget allows: `uv pip install ollama-rag-dog-breeds[presidio]`.
[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

